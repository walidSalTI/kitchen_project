<script>


// Quantities use the base stock unit. Prices are per unit, in the same currency.
const Ledger = (() => {
  const round = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const code = (prefix, n) => prefix + '-' + String(n).padStart(4, '0');
  function price(v) {
    if (v === null) return null;
    if (!Number.isFinite(v) || v < 0 || v > 1e10) throw Error('تحقّق من السعر المدخل.');
    return v;
  }
  const qround = v => Math.round((v + Number.EPSILON) * 1e6) / 1e6;
  function validQuantity(v) { return Number.isFinite(v) && v > 0 && v <= 1e9 && Math.abs(qround(v)-v) < 1e-8; }
  function plan(state, item, quantity, selected = '') {
    if (!validQuantity(quantity)) throw Error('أدخل كمية موجبة صالحة (حتى 6 منازل عشرية).');
    const lots = state.lots.filter(l => l.item === item && l.left > 1e-7 && (!selected || l.code === selected));
    let remaining = quantity;
    const lines = [];
    for (const lot of lots) {
      const q = qround(Math.min(remaining, lot.left));
      lines.push({ item, lot: lot.code, q, cost: lot.cost, sell: lot.sell, dir: -1 });
      remaining = qround(remaining - q);
      if (remaining <= 1e-7) break;
    }
    if (remaining > 1e-7) throw Error('الكمية المتاحة من ' + items[item][0] + (selected ? ' في الدفعة المحددة' : '') + ' هي ' + fmt(quantity - remaining) + ' ' + items[item][1] + '.');
    return lines;
  }
  function total(lines, field) {
    if (lines.some(l => l[field] === null)) return null;
    return round(lines.reduce((s, l) => s + l[field] * l.q, 0));
  }
  function manufacturedCost(state, item, visiting = new Set()) {
    const product = state.catalog?.[item];
    if (!product) return null;
    if (product.type !== 'manufactured') {
      if (state.pending?.[item]) return null;
      // Remember the last priced raw-material cost after manufacturing consumes its entire stock.
      const average = state.stock?.[item] > 1e-7 ? state.avg?.[item] : state.lastAvg?.[item];
      if (average == null) return null;
      return typeof average === 'number' && Number.isFinite(average) && average >= 0 ? average : null;
    }
    if (visiting.has(item)) return null;
    const components = product.components;
    if (!components || typeof components !== 'object' || !Object.keys(components).length) return null;
    const seen = new Set(visiting);
    seen.add(item);
    let cost = 0;
    for (const [component, amount] of Object.entries(components)) {
      if (!Number.isFinite(amount) || amount <= 0) return null;
      const componentCost = manufacturedCost(state, component, seen);
      if (componentCost === null) return null;
      cost += amount * componentCost;
    }
    // Retain precision for fractional recipe quantities.
    return Math.round((cost + Number.EPSILON) * 10000) / 10000;
  }

  function record(state, op, item, q, options = {}) {
    if (!Number.isSafeInteger(q) || q < 1) throw Error('أدخل كمية صحيحة أكبر من صفر.');
    const doc = code('INV', state.events.length + 1);
    const at = options.at ?? Date.now();
    let lines = [];
    if (op === 'prep') {
      const inputs = options.inputs ?? Object.fromEntries(Object.entries(state.recipes[item]).map(([k, v]) => [k, q * v]));
      for (const [k, amount] of Object.entries(inputs)) lines.push(...plan(state, k, amount));
    } else if (op !== 'receive') {
      lines = plan(state, item, q, options.selected);
      if (op === 'sale' && !options.legacy) for (const l of lines) {
        if (l.sell === null) {
          if (options.fallback == null) throw Error('أدخل سعر بيع للدفعة التي لم يُسجّل سعرها سابقاً.');
          l.sell = price(options.fallback);
        }
      }
    }
    if (op === 'receive' || op === 'prep') {
      const inputCost = total(lines, 'cost');
      const cost = op === 'prep' ? (inputCost === null ? null : inputCost / q) : price(options.cost ?? null);
      lines.push({item, lot: code('LOT', state.lots.length + 1), q, cost, sell: price(options.sell ?? null), dir: 1});
    }
    const delta = {};
    for (const l of lines) delta[l.item] = (delta[l.item] || 0) + l.dir * l.q;
    for (const [k, d] of Object.entries(delta)) {
      if (!Number.isSafeInteger(state.stock[k] + d)) throw Error('الكمية أكبر من الحد المتاح.');
    }
    for (const l of lines) {
      if (l.dir > 0) state.lots.push({code:l.lot, item:l.item, received:l.q, left:l.q, cost:l.cost, sell:l.sell, doc, at});
      else state.lots.find(b => b.code === l.lot).left -= l.q;
    }
    for (const [k,d] of Object.entries(delta)) state.stock[k] += d;
    const event = {doc, op, id:item, q, at, lines, delta};
    state.events.push(event);
    return event;
  }
  function upgrade(old, demo = false) {
    const fresh = {version:2, recipes:old.recipes, stock:Object.fromEntries(Object.keys(items).map(i => [i,0])), lots:[], events:[]};
    const example = {bread:[50,100], cheese:[2,3], thyme:[1,2], juice:[60,85], cheeseMeal:[null,220]};
    for (const e of old.events) {
      const inputs = Object.fromEntries(Object.entries(e.delta).filter(([,v]) => v < 0).map(([k,v]) => [k,-v]));
      const [cost,sell] = demo ? (example[e.id] || [null,null]) : [null,null];
      record(fresh, e.op, e.id, e.q, {inputs, cost, sell, at:e.at, legacy:true});
    }
    if (demo) record(fresh,'receive','bread',20,{cost:75,sell:125});
    return fresh;
  }
  return {plan, record, upgrade, total, round, qround, validQuantity, manufacturedCost};
})();

<script>


'use strict';
const Books = (() => {
  const accounts = {cash:'الصندوق', ar:'العملاء', inventory:'المخزون', ap:'الموردون', capital:'رأس المال والأرصدة الافتتاحية', sales:'إيراد المبيعات', cogs:'تكلفة البضاعة المباعة', electricity:'الكهرباء', gas:'الغاز', admin:'مصاريف إدارية', other:'مصاريف تشغيل أخرى', waste:'تكلفة التالف'};
  const categories=['electricity','gas','admin','other'];
  const zeros=()=>Object.fromEntries(Object.keys(items).map(k=>[k,0]));
  const cents=v=>Math.round((v+Number.EPSILON)*100);
  function check(ok,msg){if(!ok)throw Error(msg)}
  function money(v){check(Number.isFinite(v)&&v>=0&&v<=1e10&&Math.abs(v*100-Math.round(v*100))<0.0001,'أدخل مبلغاً صالحاً بمنزلتين عشريتين كحد أقصى.');return v}
  function empty(recipes){
    return {version:3,stock:zeros(),value:zeros(),avg:zeros(),prices:Object.fromEntries(Object.keys(items).map(k=>[k,null])),lots:[],events:[],pending:{},recipes,
      policy:{kind:'markup',rate:25,step:0.01,loss:'warn'}};
  }
  function setPolicy(s,p){
    check(['markup','margin'].includes(p.kind)&&Number.isFinite(p.rate)&&p.rate>=0&&p.rate<=10000&&(p.kind!=='margin'||p.rate<100),'الهامش يجب أن يكون أقل من ١٠٠٪ ونسبة الإضافة غير سالبة.');
    check(money(p.step)>0&&['warn','block'].includes(p.loss),'تحقّق من التقريب وسياسة الخسارة.');
    s.policy={...p};
  }
  function beforeRounding(avg,p){
    return p.kind==='margin'?avg/(1-p.rate/100):avg*(1+p.rate/100);
  }
  function suggest(avg,p){
    if(avg==null)return null;
    const raw=beforeRounding(avg,p);
    return cents(Math.ceil(raw/p.step-1e-10)*p.step)/100;
  }
  function averageCost(s,item) {
    if (s.catalog?.[item]?.type === 'manufactured') return Ledger.manufacturedCost(s,item);
    return s.pending?.[item] ? null : (s.avg?.[item] ?? null);
  }
  function productionQuote(s,item,quantity){
    check(s.catalog?.[item]?.type==='manufactured','اختر مادة مصنّعة مسجّلة في المخزون.');
    check(Number.isSafeInteger(quantity)&&quantity>0&&quantity<=1000000,'أدخل عدد وحدات تصنيع صحيحاً أكبر من صفر.');
    const parts=Object.entries(s.catalog[item].components||{});
    check(parts.length>0,'هذه المادة ليس لها تركيبة. حدّد مكوّناتها من إدارة المخزون.');
    const lines=[];let estimated=0, missingCost=false, enough=true;
    for(const [id,units] of parts){
      check(s.catalog?.[id]?.type==='raw','التركيبة تحتوي مكوّناً غير صالح؛ المسموح مواد أولية فقط.');
      const needed=Ledger.qround(Number(units)*quantity);
      check(Ledger.validQuantity(Number(units))&&Ledger.validQuantity(needed),'كمية المكوّن غير صالحة أو تتجاوز دقة المخزون.');
      const available=s.stock[id]||0;
      const cost=averageCost(s,id);
      if(s.pending?.[id] || cost===null)missingCost=true;
      if(available+1e-7<needed)enough=false;
      estimated+=cost===null?0:needed*cost;
      lines.push({id,name:s.catalog[id].name,unit:s.catalog[id].unit,needed,available,cost,shortage:Math.max(0,Ledger.qround(needed-available))});
    }
    return {lines,estimated:missingCost?null:Math.round((estimated+Number.EPSILON)*100)/100,enough,missingCost};
  }
  function loss(s,item,price,approved){
    const avg = averageCost(s,item);
    if(avg!==null&&price<avg-1e-10){
      check(s.policy.loss!=='block','سياسة التسعير تمنع سعراً أقل من متوسط التكلفة.');
      check(approved,'أكّد التحذير قبل اعتماد السعر الخاسر.');
    }
  }
  function setPrice(s,item,value,approved=false){
    money(value);loss(s,item,value,approved);s.prices[item]=value;
  }
  function post(s,op,item,q,o={}){
    const e={doc:'INV-'+String(s.events.length+1).padStart(4,'0'),op,id:item,q,at:o.at??Date.now(),status:'posted',lines:[],delta:{},values:{},journal:[],payment:o.payment??'cash',amount:0};
    const cash=e.payment==='cash';
    check(cash||e.payment==='credit','طريقة الدفع غير صالحة.');
    function entry(dr,cr,amount){check(Number.isSafeInteger(amount)&&amount>=0,'المبلغ يتجاوز النطاق المتاح.');e.journal.push({dr,cr,amount})}
    function priced(k){check(!Object.hasOwn(s.pending,k),'سجّل التقييم الافتتاحي لهذا الصنف من صفحة التسعير أولاً.')}
    function addLine(k,dir,lot,count,cost,sell,value){
      e.lines.push({item:k,dir,lot,q:count,cost,sell,quantity:count,unit_cost:cost,unit_price:sell,value});
      e.delta[k]=(e.delta[k]||0)+dir*count;e.values[k]=(e.values[k]||0)+dir*value;
    }
    function issue(k,n,selected){
      priced(k);const alloc=Ledger.plan(s,k,n,selected);
      const cost=s.avg[k], total=Math.max(0,Math.min(s.value[k], s.value[k]-(Math.abs(n-s.stock[k])<1e-7?0:cents(Ledger.qround(s.stock[k]-n)*cost))));
      let remaining=total;
      alloc.forEach((l,i)=>{
        const part=i===alloc.length-1?remaining:Math.min(remaining,cents(l.q*cost));remaining-=part;
        addLine(k,-1,l.lot,l.q,cost,s.prices[k],part);
      });
      return total;
    }
    function intake(k,n,cost,value){
      priced(k);addLine(k,1,'LOT-'+String(s.lots.length+1).padStart(4,'0'),n,cost,s.prices[k],value);
    }
    if(['receive','sale','waste','prep'].includes(op)){
      check(!s.catalog?.[item]?.archived,'الصنف مؤرشف.');
      check(Object.hasOwn(s.stock,item)&&Number.isSafeInteger(q)&&q>0,'أدخل كمية صحيحة موجبة.');
    }
    if(op==='receive'){
      check(s.catalog?.[item]?.type!=='manufactured','المواد المصنّعة لا تُستلم كمشتريات؛ استخدم التصنيع من نقطة البيع.');
      const cost=money(o.cost);e.amount=cents(q*cost);intake(item,q,cost,e.amount);entry('inventory',cash?'cash':'ap',e.amount);
    }else if(op==='prep'){
      const quote=productionQuote(s,item,q);
      check(!quote.missingCost,'تكلفة أحد المكونات غير مسجّلة؛ راجع مسؤول المخزون.');
      check(quote.enough,'المواد الأولية غير كافية: '+quote.lines.filter(l=>l.shortage>0).map(l=>l.name+' (ناقص '+l.shortage+' '+l.unit+')').join('، '));
      let consumed=0;
      // Consume FIFO lots, but book consumption using each item's moving average.
      for(const line of quote.lines) consumed+=issue(line.id,line.needed);
      e.amount=consumed;
      e.recipe=Object.fromEntries(quote.lines.map(l=>[l.id,l.needed]));
      e.productionUnitCost=consumed/100/q;
      intake(item,q,e.productionUnitCost,consumed);
      // Internal stock conversion: ingredient inventory -> finished inventory.
      // All items share one inventory GL account, so no cash or P&L journal entry.
    }else if(op==='sale'){
      const price=s.prices[item];check(price!=null,'حدّد سعر مبيع للصنف من صفحة التسعير.');
      loss(s,item,price,o.approved);e.cogs=issue(item,q,o.selected);e.amount=cents(price*q);
      entry(cash?'cash':'ar','sales',e.amount);entry('cogs','inventory',e.cogs);
    }else if(op==='waste'){
      e.amount=issue(item,q,o.selected);entry('waste','inventory',e.amount);
    }else if(op==='expense'||op==='capital'){
      check(money(o.amount)>0,'أدخل مبلغاً أكبر من صفر.');e.amount=cents(o.amount);
      if(op==='expense'){check(categories.includes(item),'اختر نوع المصروف.');entry(item,cash?'cash':'ap',e.amount)}
      else entry('cash','capital',e.amount);
    }else if(op==='opening'){
      check(Object.hasOwn(s.pending,item),'التقييم الافتتاحي مسجّل مسبقاً.');
      const cost=o.cost;check(Number.isFinite(cost)&&cost>=0,'أدخل تكلفة افتتاحية صالحة.');
      e.amount=cents(s.stock[item]*cost);e.openingQty=s.stock[item];e.openingCost=cost;e.values[item]=e.amount;
      entry('inventory','capital',e.amount);
    }else if(op==='reverse'){
      const src=s.events.find(d=>d.doc===o.source);
      check(src?.status==='posted'&&src.op!=='reverse'&&!s.events.some(d=>d.source===src.doc),'لا يمكن عكس هذا المستند.');
      // Unwind dependent stock movements before reversing their receipt or production.
      if(['receive','prep','opening'].includes(src.op)){
        const touched=Object.keys(src.values);
        const later=s.events.slice(s.events.indexOf(src)+1);
        const reversed=new Set(later.map(d=>d.source).filter(Boolean));
        check(!later.some(d=>d.op!=='reverse'&&!reversed.has(d.doc)&&Object.keys(d.values||{}).some(k=>touched.includes(k))),'اعكس الحركات اللاحقة على الصنف أولاً للحفاظ على تقييم المخزون.');
      }
      if(src.op==='opening'){e.openingUndo=true;e.openingQty=src.openingQty;e.values[src.id]=-src.amount}
      e.source=src.doc;e.id=src.id;e.q=src.q;e.amount=src.amount;e.payment=src.payment;
      for(const j of src.journal)entry(j.cr,j.dr,j.amount);
      for(const l of src.lines)addLine(l.item,-l.dir,l.lot,l.q,l.cost,l.sell,l.value);
    }else throw Error('نوع حركة غير معروف.');
    for(const [k,d] of Object.entries(e.values)){
      const quantity=s.stock[k]+(e.delta[k]||0), value=s.value[k]+d;
      check(Number.isFinite(quantity)&&quantity>=-1e-7&&Number.isSafeInteger(value)&&value>=0&&(quantity>1e-7||value===0),'الرصيد أو القيمة لا يسمحان بترحيل الحركة.');
    }
    for(const l of e.lines){
      const lot=s.lots.find(b=>b.code===l.lot);
      check(!lot||lot.left+l.dir*l.q>=-1e-7,'رصيد الدفعة لا يكفي لعكس الحركة.');
    }
    for(const l of e.lines){
      const lot=s.lots.find(b=>b.code===l.lot);
      if(lot)lot.left=Ledger.qround(lot.left+l.dir*l.q);
      else s.lots.push({code:l.lot,item:l.item,received:l.q,left:l.q,cost:l.cost,sell:l.sell,doc:e.doc,at:e.at});
    }
    e.avcoAfter={};
    for(const [k,d] of Object.entries(e.values)){
      const qty=e.delta[k]||0;
      s.lastAvg??={};
      if(s.stock[k]>1e-7&&!s.pending?.[k])s.lastAvg[k]=s.avg[k];
      s.stock[k]=Ledger.qround(s.stock[k]+qty);s.value[k]+=d;
      if(s.stock[k]===0)s.avg[k]=0;
      else if(qty>0||op==='opening'||op==='reverse')s.avg[k]=s.value[k]/100/s.stock[k];
      if(s.stock[k]>0&&!s.pending?.[k])s.lastAvg[k]=s.avg[k];
      e.avcoAfter[k]=s.avg[k];
    }
    if(op==='receive')e.suggestedPrice=suggest(averageCost(s,item),s.policy);
    if(op==='opening')delete s.pending[item];
    if(e.openingUndo)s.pending[e.id]=true;
    s.events.push(e);return e;
  }
  function migrate(v2){
    const s=empty(v2.recipes);s.stock={...v2.stock};s.lots=v2.lots;s.events=v2.events;
    for(const k of Object.keys(s.stock)){
      const all=s.lots.filter(l=>l.item===k),live=all.filter(l=>l.left);
      s.prices[k]=all.filter(l=>l.sell!==null).at(-1)?.sell??null;
      if(!s.stock[k])continue;
      s.pending[k]=true;
      if(live.every(l=>l.cost!==null))post(s,'opening',k,s.stock[k],{cost:live.reduce((a,l)=>a+l.left*l.cost,0)/s.stock[k]});
    }
    return s;
  }
  function report(s,from=-Infinity,to=Infinity){
    const balance=Object.fromEntries(Object.keys(accounts).map(k=>[k,0]));
    const period={...balance}, quantities=zeros(), values=zeros(), movements=[], entries=[];
    let purchases=0,opening=0,beginning=0;
    for(const e of s.events){
      if(e.status!=='posted'||e.at>to)continue;
      const inside=e.at>=from;
      for(const j of e.journal){
        balance[j.dr]+=j.amount;balance[j.cr]-=j.amount;
        if(inside){period[j.dr]+=j.amount;period[j.cr]-=j.amount;entries.push({...j,e})}
        else beginning+=((j.dr==='inventory')-(j.cr==='inventory'))*j.amount;
      }
      for(const [k,v] of Object.entries(e.values))values[k]+=v;
      for(const [k,q] of Object.entries(e.delta))quantities[k]+=q;
      if(e.op==='opening')quantities[e.id]+=e.openingQty;
      if(e.openingUndo)quantities[e.id]-=e.openingQty;
      if(!inside)continue;
      movements.push(e);
      if(e.op==='receive')purchases+=e.amount;
      if(e.op==='reverse'&&s.events.find(d=>d.doc===e.source)?.op==='receive')purchases-=e.amount;
      if(e.op==='opening')opening+=e.amount;
      if(e.openingUndo)opening-=e.amount;
    }
    const costs=b=>categories.reduce((n,k)=>n+b[k],b.waste);
    const gross=-period.sales-period.cogs,net=gross-costs(period);
    const assets=balance.cash+balance.ar+balance.inventory, liabilities=-balance.ap, equity=-balance.capital-balance.sales-balance.cogs-costs(balance);
    const inventoryDiff=beginning+opening+purchases-period.cogs-period.waste-balance.inventory;
    return {balance,period,quantities,values,movements,entries,purchases,opening,beginning,gross,net,expenses:costs(period),assets,liabilities,equity,inventoryDiff};
  }
  function sample(recipes){
    const s=empty(recipes);setPrice(s,'bread',100);
    post(s,'capital','capital',1,{amount:10000});post(s,'receive','bread',100,{cost:50});
    post(s,'sale','bread',20);post(s,'receive','bread',80,{cost:75,payment:'credit'});
    setPrice(s,'bread',125);post(s,'sale','bread',40,{payment:'credit'});
    post(s,'expense','electricity',1,{amount:300});post(s,'expense','gas',1,{amount:150,payment:'credit'});return s;
  }
  return {accounts,categories,empty,setPolicy,beforeRounding,suggest,averageCost,productionQuote,setPrice,post,migrate,report,sample,cents};
})();

function home(){
 const r=Books.report(state), lot=state.lots.at(-1);
 const ticket=lot?'<div class="art"><div class="ticket back"></div><div class="ticket"><div class="cap">آخر دفعة واردة '+icon('box')+'</div><strong>'+items[lot.item][0]+'</strong><div class="ticketrow"><span>كمية الدفعة</span><b>'+fmt(lot.received)+' '+items[lot.item][1]+'</b></div><div class="ticketrow"><span>رقم الدفعة</span>'+serial(lot.code)+'</div><div class="barcode"></div></div></div>':'';
 return '<section class="hero"><div><h1>المخزون والمحاسبة</h1><p>تابع أرصدة الأصناف والدفعات وسجّل فواتير المقصف.</p><div class="actions">'+(Object.values(state.catalog).some(i=>i.type!=='manufactured')?button('receive','استلام مواد','primary'):button('addItem','إضافة أول صنف','primary'))+button('expense')+'</div></div>'+ticket+'</section><div class="kpis">'+
 card('قيمة المخزون المقيّم',r.balance.inventory/100,'','box','sage')+card('رصيد الصندوق',r.balance.cash/100,'','capital','gold')+card('المستحق للموردين',r.liabilities/100,'','log','blue')+
 '</div><div class="grid"><section class="panel"><div class="panelhead"><h2>أرصدة الأصناف</h2><a class="link" href="#stock">عرض المخزون</a></div>'+inventory(Object.keys(items))+'</section><section class="panel"><div class="panelhead"><h2>آخر الحركات</h2><a class="link" href="#history">عرض الكل</a></div>'+logList(state.events.slice(-4).reverse())+'</section></div>';
}
function chips(values,active,attr){return '<div class="filters">'+Object.entries(values).map(([k,v])=>'<button class="chip '+(active===k?'on':'')+'" '+attr+'="'+k+'">'+v+'</button>').join('')+'</div>'}
function stockPage(){return '<div class="pagehead"><h1>المخزون</h1><div class="actions">'+button('addItem',null,'primary')+(Object.keys(items).length?(Object.values(state.catalog).some(i=>i.type!=='manufactured')?button('receive'):'')+button('waste'):'')+'</div></div><section class="panel">'+chips({all:'الكل',raw:'مواد أولية',ready:'أصناف جاهزة',manufactured:'مواد مصنّعة',archived:'المؤرشفة'},filter,'data-filter')+inventory(Object.keys(items).filter(i=>filter==='archived'?state.catalog[i].archived:!state.catalog[i].archived&&(filter==='all'||items[i][2]===filter)))+'</section>'}
const HIDDEN_HISTORY_OPS=[];
const HISTORY_COLORS={sale:'#276b4e',receive:'#457080',prep:'#c9962f',waste:'#c9714a',expense:'#8a6bb0',addItem:'#5aa6a0',composition:'#8fb85a',price:'#d6a0a8',policy:'#8c8c7a'};
function historyPage(){
 const evs=state.events.filter(e=>ops[e.op]&&!HIDDEN_HISTORY_OPS.includes(e.op));
 const counts={};evs.forEach(e=>counts[e.op]=(counts[e.op]||0)+1);
 const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
 const total=evs.length;
 const head='<div class="pagehead"><h1>سجل الحركات</h1>'+button('expense',null,'primary')+'</div>';
 if(!total)return head+'<section class="panel"><p class="empty">ما في حركات مسجّلة بعد.</p></section>';
 if(historyFilter!=='all'&&!counts[historyFilter])historyFilter='all';
 const R=100,C=110;let a0=-Math.PI/2,slices='';
 const pt=a=>(C+R*Math.cos(a)).toFixed(2)+' '+(C+R*Math.sin(a)).toFixed(2);
 keys.forEach(k=>{
  const col=HISTORY_COLORS[k]||'#999',label=ops[k][2]+': '+fmt(counts[k]),on=historyFilter===k;
  const attrs=' class="slice'+(on?' on':'')+'" fill="'+col+'" data-hist="'+k+'" tabindex="0" role="button" aria-label="'+label+'"';
  if(keys.length===1){slices+='<circle cx="'+C+'" cy="'+C+'" r="'+R+'"'+attrs+'><title>'+label+'</title></circle>';return}
  const a1=a0+counts[k]/total*2*Math.PI;
  slices+='<path d="M'+C+' '+C+' L'+pt(a0)+' A'+R+' '+R+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+pt(a1)+' Z"'+attrs+'><title>'+label+'</title></path>';
  a0=a1;
 });
 const legend=keys.map(k=>'<button type="button" class="legendrow'+(historyFilter===k?' on':'')+'" data-hist="'+k+'"><i style="background:'+(HISTORY_COLORS[k]||'#999')+'"></i><span>'+ops[k][2]+'</span><b>'+fmt(counts[k])+'</b><small>'+Math.round(counts[k]/total*100)+'%</small></button>').join('');
 const chart='<div class="piewrap"><svg class="pie" viewBox="0 0 220 220" role="img" aria-label="توزيع الحركات حسب النوع">'+slices+'</svg><div class="pielegend">'+legend+'<div class="pietotal">إجمالي الحركات <b>'+fmt(total)+'</b></div></div></div>';
 const detail=historyFilter==='all'?'<p class="note piehint">اضغط على جزء من الرسم أو على نوع من القائمة لعرض فواتير هذا النوع.</p>':'<h2 class="pietitle">'+ops[historyFilter][2]+' ('+fmt(counts[historyFilter])+')</h2>'+logList(evs.filter(e=>e.op===historyFilter).slice().reverse(),true);
 return head+'<section class="panel">'+chart+detail+'</section>';
}
function render(){page=location.hash.slice(1);if(!Object.hasOwn(pages,page))page='home';$('nav').innerHTML=Object.entries(pages).map(([k,[n,s]])=>'<a href="#'+k+'" class="navbtn '+(page===k?'active':'')+'" '+(page===k?'aria-current="page"':'')+'>'+icon(s)+n+'</a>').join('');$('main').innerHTML=isPos?posPage():page==='home'?home():page==='stock'?stockPage():page==='pricing'?pricingPage():page==='reports'?reportsPage():historyPage()}

const digits=v=>v===null?'غير مسجّل':(Number(v)||0).toLocaleString('ar',{maximumFractionDigits:4});
const serial=s=>'<bdi class="serial">'+s+'</bdi>';
const line=(a,b)=>'<div class="summaryline"><span>'+a+'</span><b>'+b+'</b></div>';

 if(!allows(op))return;
 if(specialModes.includes(op))return specialForm(op,selected);

   $('fields').innerHTML='<label for="choice">الصنف</label><select id="choice">'+ids.map(i=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+items[i][0]+'</option>').join('')+'</select><div id="batchChoice"></div><label for="amount" id="amountLabel"></label><input type="number" min="1" step="1" id="amount" required value="1"><div id="pricing"></div><div id="fallback"></div><div class="summary" id="summary"></div>';

 const i=$('choice').value;

 $('amountLabel').textContent='الكمية ('+items[i][1]+')';
 $('batchChoice').innerHTML=['sale','waste'].includes(mode)?'<label for="batch">الصرف من الدفعة</label><select id="batch"><option value="">الأقدم أولاً — تلقائي</option>'+lots.map(l=>'<option value="'+l.code+'">'+l.code+' · متاح '+fmt(l.left)+'</option>').join('')+'</select>':'';
 $('pricing').innerHTML=mode==='receive'?numberField('cost','تكلفة شراء الوحدة')+paymentField():mode==='sale'?paymentField():'';

function previewLines(i,q){
 if(mode==='receive'||mode==='prep')return [];
 return Ledger.plan(state,i,q,$('batch')?.value||'');
}
function getPrice(id){const el=$(id);return el&&el.value!==''?Number(el.value):null}
function summary(){
 const i=$('choice').value,q=Number($('amount').value);
 $('error').textContent='';
 let body='';
 try{
   if(!Number.isSafeInteger(q)||q<1)throw Error('أدخل كمية صحيحة أكبر من صفر.');
   const lines=previewLines(i,q);
   if(mode==='prep'){
     const quote=Books.productionQuote(state,i,q);
     body='<strong>المواد المطلوبة للتصنيع:</strong>'+quote.lines.map(l=>line(l.name+' ('+l.unit+')',fmt(l.needed)+' مطلوب / '+fmt(l.available)+' متاح'+(l.shortage>0?' — ناقص '+fmt(l.shortage):''))).join('')+
       line('التكلفة المتوقعة للتصنيع',quote.estimated===null?'غير مسجّلة':digits(quote.estimated))+
       (!quote.enough?'<p class="losswarn">المواد الأولية غير كافية. لا يمكن تأكيد التصنيع.</p>':'')+
       (quote.missingCost?'<p class="losswarn">متوسط تكلفة أحد المكونات غير مسجّل.</p>':'');
   }else {
   if(state.pending[i])throw Error(isPos?'تقييم الصنف غير مكتمل. راجع مسؤول المخزون.':'أكمل تقييم الصنف من صفحة التسعير.');
   if(mode==='receive'){
     const cost=getPrice('cost'),avg=cost===null?null:(state.value[i]/100+q*cost)/(state.stock[i]+q);
      const recipeCost = Books.averageCost(state,i);
      body=line('إجمالي الشراء',cost===null?'—':digits(Ledger.round(q*cost)))+line('المتوسط المحاسبي بعد الشراء',digits(avg))+
        (state.catalog[i].type==='manufactured'?line('متوسط تكلفة المكوّنات',digits(recipeCost)):'')+
        line('سعر المبيع الحالي',digits(state.prices[i]))+line('مقترح السياسة',digits(Books.suggest(state.catalog[i].type==='manufactured'?recipeCost:avg,state.policy)));
     if(avg!==null&&state.prices[i]!==null&&state.prices[i]<(state.catalog[i].type==='manufactured'?recipeCost??avg:avg))body+='<div class="losswarn">سعر المبيع الحالي أقل من متوسط التكلفة بعد الشراء.</div>';
   }else{
     for(const l of lines)body+=line('الدفعة '+serial(l.lot),fmt(l.q)+' '+items[i][1]);
     if(mode==='waste')body+=line('التكلفة بالمتوسط',digits(Ledger.round(q*state.avg[i])));
     if(mode==='sale'){
       const p=state.prices[i];body+=line('سعر بيع الوحدة',digits(p))+line('إجمالي البيع',p===null?'—':digits(Ledger.round(q*p)));
       if(p===null)body+='<p class="losswarn">سعر البيع غير محدد. راجع مسؤول التسعير.</p>';
        lossControl(p,Books.averageCost(state,i));
     }
   }
   }
 }catch(err){body='<span class="note">'+err.message+'</span>';$('fallback').innerHTML=''}
 $('summary').innerHTML=body;
}
let returnLot='';

 if(!$('document').open)$('document').showModal();
}

function invoice(doc,from='',book=state){
 const e=book.events.find(e=>e.doc===doc);if(!e)return;
  if(isPos){if(e.op==='sale')posReceipt(e);else if(e.op==='prep')posProductionReceipt(e);return}
 if(e.status==='posted')return postedInvoice(e,from,book);

 returnLot=from;
 const field=e.op==='sale'?'sell':'cost';
 const totals=e.op==='prep'?e.lines.filter(l=>l.dir===1):e.lines;
 const total=Ledger.total(totals,field);
 const body=e.lines.map(l=>'<tr><td><b>'+items[l.item][0]+'</b>'+(e.op==='prep'?'<small>'+(l.dir<0?'مكوّن مستهلك':'وجبة ناتجة')+'</small>':'')+'</td><td>'+serial(l.lot)+'</td><td>'+fmt(l.q)+' '+items[l.item][1]+'</td><td>'+digits(l.cost)+'</td><td>'+digits(l.sell)+'</td><td>'+digits(Ledger.total([l],field))+'</td></tr>').join('');

function lotView(i){
 if(isPos)return;
 returnLot=i;

 paper('<div class="paperbar"><span>'+icon('box')+' مخزون الدفعات</span>'+closePaper+'</div><div class="lotbody"><h2 id="paperTitle">دفعات '+items[i][0]+'</h2><p class="note">الرصيد المتاح '+fmt(state.stock[i])+' '+items[i][1]+'</p><div class="tablewrap"><table><thead><tr><th>الدفعة</th><th>الوارد</th><th>المتبقي</th><th>الجملة / التكلفة</th><th>المبيع وقت الإدخال</th><th>مستند الإدخال</th></tr></thead><tbody>'+lots.map(l=>'<tr><td>'+serial(l.code)+'</td><td>'+fmt(l.received)+'</td><td><b>'+fmt(l.left)+'</b></td><td>'+digits(l.cost)+'</td><td>'+digits(l.sell)+'</td><td>'+invoiceLink(l.doc)+'</td></tr>').join('')+'</tbody></table></div>'+(related.length?'<h3>حركات الصنف</h3>'+logList(related):'<p class="empty">ما في دفعات مسجّلة بعد.</p>')+'</div>');
}
function save(){

 const next=read();let event;
 if(mode==='manage')event=submitManagement(next);
 else if(specialModes.includes(mode))event=saveSpecial(next);
 else{
   event=Books.post(next,mode,$('choice').value,Number($('amount').value),{
     cost:getPrice('cost'),selected:$('batch')?.value,payment:$('pay')?.value,approved:$('approveLoss')?.checked
   });
 }
 localStorage.setItem(key,JSON.stringify(next));state=next;items=displayItems(next.catalog);render();$('modal').close();

 else{$('toast').textContent=event?.op==='reverse'?'تم إلغاء المستند':'تم حفظ التعديلات';$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2000)}

$('paper').addEventListener('click',e=>{

});
$('close').onclick=()=>$('modal').close();
$('fields').oninput=e=>{if(mode==='manage')return;if(specialModes.includes(mode)){specialPreview();return}if(e.target.id==='choice')setupItem();else summary()};

<script>


'use strict';
const specialModes=['addItem','composition','price','policy','expense','capital','opening','reverse'];
let activeReport='profit',fromDay='',toDay='';
const cashText=e=>e.payment==='credit'?'على الحساب':'نقداً';
const amount=c=>digits(c/100);
const options=(values,selected)=>Object.entries(values).map(([k,v])=>'<option value="'+k+'" '+(k===selected?'selected':'')+'>'+v+'</option>').join('');

function table(headers,rows){
 return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(rows.length?'':'<p class="empty">لا توجد حركات ضمن الفترة المحددة.</p>');

function lossControl(p,avg){
 const host=$('fallback');if(!host)return;
 if(p===null||avg===null||p>=avg-1e-10){host.innerHTML='';return}
 const block=state.policy.loss==='block';
 const warn='<div class="losswarn"><b>تحذير سعر خاسر</b><div>'+(isPos?'':'الخسارة لكل وحدة '+digits(avg-p)+'. ')+(block?'سياسة المقصف تمنع الترحيل بهذا السعر.':'يتطلب اعتماد هذا السعر تأكيداً صريحاً.')+'</div></div>';
 const token=[mode,p,avg,$('choice')?.value,$('amount')?.value].join('|');
 const previous=host.dataset.confirmedFor===token&&$('approveLoss')?.checked;host.dataset.confirmedFor=token;
 host.innerHTML=warn+(block?'':'<label class="confirmLoss"><input type="checkbox" id="approveLoss"> أوافق على السعر الأقل من التكلفة</label>');
 if($('approveLoss'))$('approveLoss').checked=previous||false;
}
function pricingPage(){
 const pol=state.policy;
 const rows=activeIds().map(k=>{

function readComponents(catalog){

$('main').addEventListener('change',e=>{
 if(e.target.id==='fromDay'){fromDay=e.target.value;if(toDay&&fromDay>toDay)toDay=fromDay}
 else if(e.target.id==='toDay'){toDay=e.target.value;if(fromDay&&toDay&&fromDay>toDay)fromDay=toDay}
 else return;
 render();
});
$('main').addEventListener('click',e=>{if(e.target.closest('#allDates')){fromDay='';toDay='';render()}});
render();



</script></body></html>
